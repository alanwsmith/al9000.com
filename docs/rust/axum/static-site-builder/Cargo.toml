[package]
name = "static_site_builder"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.103"
axum = "0.8.9"
chrono = "0.4.45"
itertools = "0.15.0"
minijinja = { version = "2.21.0", features = ["custom_syntax"] }
notify = "8.2.0"
notify-debouncer-full = "0.7.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tokio = { version = "1.52.3", features = ["rt-multi-thread"] }
toml = "1.1.2"
tower-http = { version = "0.7.0", features = ["fs"] }
tower-livereload = "0.10.3"
tower-sessions = "0.15.0"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["json"] }
