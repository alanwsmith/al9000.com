<div class="two-columns">
  <div>
    == if input == "text"
    <input 
      type="text" 
      class="default" 
      data-s="update[@ key @]" 
      data-r="show[@ key @]Example clear[@ key @]" 
      autocomplete="off"
    />
    == else
    <textarea 
      class="d" 
      data-s="update[@ key @]" 
      data-r="show[@ key @]Example clear[@ key @]" 
      autocomplete="off"></textarea>
    == endif
    <button data-s="show[@ key @]Example">Show Example</button>
    <button data-s="clear[@ key @]">Clear Input</button>
  </div>
  <div>
    == if input == "text"
    <input 
      type="text" 
      class="default" 
      data-r="update[@ key @] copy[@ key @]" 
      autocomplete="off"
    />
    == else
    <textarea 
      class="d" 
      data-r="update[@ key @] copy[@ key @]" 
      autocomplete="off"></textarea>
    == endif
    <div class="text-align-right">
      <button data-s="copy[@ key @]">Copy</button>
    </div>
  </div>
</div>
