== extends "wrapper.html"

== block body

<form method="post" action="/add">
  <input type="text" name="text" />
  <input type="submit" value="Add New Item" />
</form>

<ul>
== for item in items
  <li>
    [@ item.text @] 
    <a href="/edit/[@ item.id @]">edit</a>
    <a href="/delet/[@ item.id @]">delete</a>
  </li>
== endfor
</ul>

== endblock
