<div>
    == include template_dir() + "/instructions.html"

    <div class="border-1">
        <div data-r="initModeButtons" class="flex-line"></div>
    </div>

    <div class="border-1">
        <div data-r="initBackgroundSliders"></div>
    </div>


    <div class="border-1">
        <div class="two-columns-left">
            <div data-r="initColorNameButtons" class="color-buttons"></div>
            <div data-r="initHueOffsetButtons uHueOffsetButtons" class="hue-offset-buttons"></div>
        </div>
        [#
        <div data-r="uColorName" class="color-name"></div>
        #]
        <div data-r="initColorSliders"></div>
    </div>

    <div>
        <details>
            <summary>Custom Styles</summary>
            <textarea 
                data-r="iCustomStyles gCustomStyles"
                autocomplete="off"
            ></textarea>
            <button data-s="gCustomStyles">Save Styles</button>
        </details>
    </div>
</div>
