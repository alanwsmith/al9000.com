== block styles
<link rel="stylesheet" href="/styles/main.css" />
<style>
:root {

}
  body { background-image: none; }

</style>

== block scripts
== endblock


== block content
<div data-r="initModeButtons"></div>
<div data-r="initBackgroundSliders"></div>
<div data-r="initColorButtons"></div>
<div data-r="initHueOffsetButtons"></div>
== endblock 


== block templates
<bitty-8 data-connect="[@ template_folder() + '/bit.js' @]"></bitty-8>
<script type="text/html" data-template="modeButton">
  <div>
    <label>__KEY__
      <input data-s="setMode" data-key="__KEY__" type="radio" name="modeButton" __CHECKED__ autocomplete="off" />
    </label>
  </div>
</script>

<script type="text/html" data-template="backgroundSlider">
  <div>
    <label>__KEY__
      <input 
        type="range" 
        data-s="setParam" 
        data-key="__KEY__" 
        min="__MIN__" 
        max="__MAX__" 
        step="__STEP__" 
        value="__VALUE__" 
        autocomplete="off" />
    </label>
  </div>
</script>

<script type="text/html" data-template="colorButton">
  <button data-s="setColor" data-index="__INDEX__">__COLOR__</button>
</script>

<script type="text/html" data-template="hueOffsetButton">
  <button data-s="setHueOffset" data-index="__INDEX__">set</button>
</script>


== endblock
