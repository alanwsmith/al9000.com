  <body>
    <noscript>
  <p>
    NOTE: This site use JavaScript which appears to be turned off. 
    Some content will be fine, but some things won't work.
  </p>

</noscript>

    <div class="payload">
      <button data-s="resetDefaults">Reset to Defaults</button>

<div>
  <div class="default-base-color">base</div>
  <div class="default-heading-color">heading</div>
  <div class="default-info-color">info</div>
  <div class="default-accent-color">accent</div>
  <div class="default-warning-color">warning</div>
</div>

<div data-r="initModeButtons"></div>
<div data-r="initBackgroundSliders"></div>
<div data-r="initColorNameButtons"></div>
<div data-r="initHueOffsetButtons"></div>
<div data-r="initColorSliders"></div>



    </div>

    <div class="template" hidden>
      <bitty-9 data-connect="/bits/default.js"></bitty-9>
      <script type="module" src="/bits/components.js"></script>
      
<bitty-9 data-connect="&#x2f;color-picker&#x2f;bit.js"></bitty-9>


<script type="text/html" data-template="backgroundSlider">
  <div>
    <label>__NAME__
      <input 
        type="range" 
        data-s="setParam" 
        data-r="updateBackgroundValue" 
        data-key="__KEY__" 
        min="__MIN__" 
        max="__MAX__" 
        step="__STEP__" 
        value="__VALUE__" 
        autocomplete="off" />
    </label>
  </div>
</script>

<script type="text/html" data-template="colorNameButton">
<button class="default-__COLOR__-color" data-s="setColorName" data-r="setColorNameStyles" data-index="__INDEX__">__COLOR__</button>
</script>

<script type="text/html" data-template="colorSliders">
<div><label>L</label>
  <input 
    type="range" 
    data-s="setColorValue" 
    data-r="updateColorValue"
    data-key="L"
    min="0"
    max="1.0"
    step="0.001"
    value="__L__"
    autocomplete="off"
  />
</div>
<div><label>80</label>
  <input 
    type="range" 
    data-s="setColorValue" 
    data-r="updateColorValue"
    data-key="80"
    min="0"
    max="1.0"
    step="0.001"
    value="__80__"
    autocomplete="off"
  />
</div>
<div><label>20</label>
  <input 
    type="range" 
    data-s="setColorValue" 
    data-r="updateColorValue"
    data-key="20"
    min="0"
    max="1.0"
    step="0.001"
    value="__20__"
    autocomplete="off"
  />
</div>
<div><label>C</label>
  <input 
    type="range" 
    data-s="setColorValue" 
    data-r="updateColorValue"
    data-key="C"
    min="0"
    max="0.3"
    step="0.0001"
    value="__C__"
    autocomplete="off"
  />
</div>
</script>

<script type="text/html" data-template="hueOffsetButton">
  <button data-s="setHueOffset" data-r="updateHueOffset" data-index="__INDEX__">set</button>
</script>

<script type="text/html" data-template="modeButton">
  <div>
    <label>__KEY__
      <input data-s="setMode" data-key="__KEY__" type="radio" name="modeButton" __CHECKED__ autocomplete="off" />
    </label>
  </div>
</script>
    </div>
  </body>
