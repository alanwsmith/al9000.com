<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">

<style>
    body {
      background: black;
      color: goldenrod;
    }
</style>
    <script src="https://www.youtube.com/iframe_api"></script>
</head>
<body>

  <div id="frameStatus">-ddd-</div>
 
  <button id="playPause">Play/Pause</button>
<div id="player"></div>

<script>

  let player;
  
function playPauseVideo() {
    if (player.getPlayerState() === 1) {
	player.pauseVideo()
    } else {
	player.playVideo()
    }
}
  
  function onYouTubeIframeAPIReady() {
//      document.getElementById("state").innerHTML = "iframe loaded";
      loadVideo();
  }

  function loadVideo() {
      const videoId = "-91vymvIH0c";
      player = new YT.Player("player", {
	  height: "220",
	  width: "380",
	  videoId: videoId,
	  events: {
	      // onReady: onPlayerReady,
	      // onStateChange: onPlayerStateChange,
	  },
      });
  }
      
  window.addEventListener("message", (event) => {
      const el = document.querySelector("#frameStatus");
      if (!event.data) {
	  el.innerHTML = el.innerHTML + JSON.stringify(event);
	  playPauseVideo();
      }
//      console.log("PING MESSAGE");
  })
  

window.addEventListener("DOMContentLoaded", () => {
  document.querySelector("#playPause").addEventListener(
  "click", () => {
  playPauseVideo();
}
)
})
</script>

</body>
</html>
