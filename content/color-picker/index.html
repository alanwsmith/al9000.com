== extends "/templates.inc/switches/empty.html"
== block toml
title = "Color Picker"
created = 2026-07-21T21:09:00-04:00
status = "draft"
id = "01/n6/06/1c" 
== endblock 


== block styles
<link rel="stylesheet" href="/styles/main.css" />
<style>
:root {

}
  body { background-image: none; }

</style>
== endblock


== block scripts
== endblock


== block content
<div data-r="initModeButtons"></div>
<div data-r="initBackgroundSliders"></div>
<div data-r="initColorButtons"></div>
<div data-r="initHueOffsetButtons"></div>
<div data-r="initColorSliders"></div>
== endblock 


== block templates
<bitty-8 data-connect="[@ template_folder() + '/bit.js' @]"></bitty-8>
<script type="text/html" data-template="modeButton">
  <div>
    <label>__KEY__
      <input data-s="setMode" data-key="__KEY__" type="radio" name="modeButton" __CHECKED__ autocomplete="off" />
    </label>
  </div>
</script>

<script type="text/html" data-template="backgroundSlider">
  <div>
    <label>__KEY__
      <input 
        type="range" 
        data-s="setParam" 
        data-key="__KEY__" 
        min="__MIN__" 
        max="__MAX__" 
        step="__STEP__" 
        value="__VALUE__" 
        autocomplete="off" />
    </label>
  </div>
</script>

<script type="text/html" data-template="colorButton">
  <button data-s="setColorName" data-index="__INDEX__">__COLOR__</button>
</script>

<script type="text/html" data-template="hueOffsetButton">
  <button data-s="setHueOffset" data-index="__INDEX__">set</button>
</script>


<script type="text/html" data-template="colorSliders">
<div><label>L</label>
  <input 
    type="range" 
    data-s="setColorValue" 
    data-key="L"
    min="0"
    max="1.0"
    step="0.001"
    value="__L__"
  />
</div>
<div><label>80</label>
  <input 
    type="range" 
    data-s="setColorValue" 
    data-key="80"
    min="0"
    max="1.0"
    step="0.001"
    value="__80__"
  />
</div>
<div><label>20</label>
  <input 
    type="range" 
    data-s="setColorValue" 
    data-key="20"
    min="0"
    max="1.0"
    step="0.001"
    value="__20__"
  />
</div>
<div><label>C</label>
  <input 
    type="range" 
    data-s="setColorValue" 
    data-key="C"
    min="0"
    max="0.3"
    step="0.0001"
    value="__C__"
  />
</div>
</script>



== endblock
